<!doctype html>
<!--
  PROTOTYPE — throwaway. Not production code.
  Plan: Splendor's Moment screen as one design, "Chapel, evolved": each Moment reveals its Passage line by line
  over a dimmed, drifting Image, then the Passage moves to the corner and the Image comes up to full brightness.
  Add ?fast=1 for short Moments and Sessions when testing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050403;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{color:#efe6d6;font-family:'Cormorant Garamond',serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:#050403}
.screen{position:absolute;inset:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn 1.8s ease both}

/* the YouTube player stays in the DOM at a real size, tucked underneath the page */
#yt-wrap{position:fixed;right:0;bottom:0;width:200px;height:200px;z-index:-1;pointer-events:none;opacity:.001}
#yt-wrap iframe{width:100%;height:100%;display:block}
#yt-wrap.ask{z-index:20;opacity:1;pointer-events:auto;width:192px;height:108px;right:calc(26px + env(safe-area-inset-right));bottom:calc(178px + env(safe-area-inset-bottom));border-radius:4px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:opacity 1s}
#yt-ask{position:fixed;z-index:20;right:calc(26px + env(safe-area-inset-right));bottom:calc(292px + env(safe-area-inset-bottom));font-style:italic;font-size:15px;color:#f1e8d8;text-shadow:0 1px 8px rgba(0,0,0,.7);display:none}
#yt-ask.on{display:block}
#proto{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:9999;background:#facc15;color:#111;border-radius:999px;padding:4px 9px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;pointer-events:none;opacity:.9}

.sc{font-family:'Cormorant SC',serif;font-weight:500;letter-spacing:.32em}

/* candle */
.candle{position:relative;width:14px;height:58px;margin:0 auto}
.candle .wax{position:absolute;bottom:0;left:2px;width:10px;height:30px;background:linear-gradient(90deg,#c9b89a,#efe3c9 45%,#b4a283);border-radius:2px 2px 0 0}
.candle .wick{position:absolute;bottom:30px;left:6.5px;width:1px;height:5px;background:#2a2016}
.candle .flame{position:absolute;bottom:33px;left:1px;width:12px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 75%,#fff7e0 0%,#ffd27a 35%,#ff9d3a 65%,rgba(255,120,40,0) 75%);filter:blur(.4px);transform-origin:50% 100%;animation:flicker 2.8s ease-in-out infinite}
.candle .halo{position:absolute;bottom:20px;left:-43px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,110,.28),rgba(255,160,70,.08) 40%,transparent 70%);animation:breathe 3.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(.96,1.04) rotate(-1.5deg)}45%{transform:scale(1.03,.97) rotate(1deg)}70%{transform:scale(.98,1.05) rotate(-.6deg)}}
@keyframes breathe{50%{opacity:.7}}

/* drifting image layers */
.layers{position:absolute;inset:0;overflow:hidden}
.img{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;transition:opacity 3s ease,filter 2.4s ease;filter:brightness(.42) saturate(.8) sepia(.18) contrast(1.05)}
.img.show{opacity:1}
.drift1{animation:kb1 70s ease-in-out infinite alternate}
.drift2{animation:kb2 70s ease-in-out infinite alternate}
.drift3{animation:kb3 70s ease-in-out infinite alternate}
@keyframes kb1{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2.5%,-1.5%)}}
@keyframes kb2{from{transform:scale(1.15) translate(2%,1%)}to{transform:scale(1.04) translate(-1%,0)}}
@keyframes kb3{from{transform:scale(1.06) translate(-1.5%,1.5%)}to{transform:scale(1.17) translate(1.5%,-1%)}}
.paused .img,.paused .flame{animation-play-state:paused}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.86) 100%);pointer-events:none;transition:opacity 2.4s ease}
.stage.rest .img{filter:none}
.stage.rest .vignette{opacity:0}
.backdrop{position:absolute;inset:0;display:flex;justify-content:center;padding-top:12vh;opacity:0;transition:opacity 3s}
.backdrop.show{opacity:1}
.dark-veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition-property:opacity;transition-timing-function:linear}
.dark-veil.on{opacity:1}

/* home: Today's Moment */
.home .img{filter:brightness(.5) saturate(.85) sepia(.12)}
.home-top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:26px;font-size:13px;color:#d9c7a6;letter-spacing:.5em}
.home-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 120px;gap:22px}
.home-mid .k{font-size:13px;color:#cdb892;letter-spacing:.42em;padding-left:.42em}
.home-mid h1{font-weight:300;font-size:clamp(56px,9vw,112px);line-height:.95;color:#f6eddc;text-shadow:0 2px 40px rgba(0,0,0,.5)}
.home-mid .sub{font-style:italic;font-size:clamp(18px,1.8vw,22px);color:#cbbda5;margin-top:-6px}
.lens{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;margin-top:18px}
.lens button{font-style:italic;font-size:clamp(19px,1.7vw,22px);color:#b7a88f;padding:4px 2px;border-bottom:1px solid transparent;transition:color .8s,border-color .8s,text-shadow .8s}
.lens button:hover{color:#efe6d6}
.lens button.on{color:#fff1d6;border-bottom-color:rgba(255,200,130,.6);text-shadow:0 0 24px rgba(255,180,90,.4)}
.enter{font-family:'Cormorant SC',serif;font-size:15px;letter-spacing:.5em;padding:17px 34px 17px calc(34px + .5em);border:1px solid rgba(239,230,214,.42);border-radius:999px;background:rgba(10,8,6,.18);transition:border-color 1s,background 1s,opacity 1.6s;margin-top:6px}
.enter:hover{border-color:rgba(255,210,150,.85);background:rgba(255,190,110,.08)}
.enter.wait{opacity:0;pointer-events:none}
.linkish{font-size:12px;color:#a89a83;letter-spacing:.34em;padding-left:.34em;margin-top:4px}
.linkish:hover{color:#efe6d6}
.home-credit{position:absolute;left:26px;bottom:calc(24px + env(safe-area-inset-bottom));font-style:italic;font-size:15px;color:rgba(232,220,198,.62);max-width:44vw;line-height:1.4}
.soundcheck{position:absolute;right:26px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;font-style:italic;font-size:16px;color:#cbbda5}
.soundcheck button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(239,230,214,.38);display:flex;align-items:center;justify-content:center;transition:border-color .8s,background .8s}
.soundcheck button:hover{border-color:rgba(255,210,150,.8);background:rgba(255,190,110,.08)}

/* library + threshold */
.lib{position:absolute;inset:0;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) clamp(16px,5vw,72px) 72px}
.lib h2{font-family:'Cormorant SC',serif;font-weight:500;font-size:15px;letter-spacing:.55em;padding-left:.55em;color:#d9c7a6;text-align:center;margin:0 0 clamp(28px,5vh,52px)}
.covers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,300px));justify-content:center;gap:clamp(14px,2.4vw,32px);max-width:1180px;margin:0 auto}
.cover{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;border-radius:2px;background:#15100b;text-align:left;box-shadow:0 18px 50px rgba(0,0,0,.55);opacity:0;animation:fadeIn 1.6s ease forwards}
.cover .ci{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.8);transition:transform 6s ease,filter 1.2s}
.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,6,4,.88) 0%,rgba(8,6,4,.35) 34%,rgba(8,6,4,0) 58%)}
.cover .cn{position:absolute;left:22px;right:22px;bottom:46px;z-index:1;font-weight:300;font-size:clamp(34px,3.2vw,46px);line-height:1;color:#f4ead8}
.cover .cc{position:absolute;left:22px;right:22px;bottom:22px;z-index:1;font-family:'Cormorant SC',serif;font-size:12px;letter-spacing:.3em;color:#cdbfa8}
.cover:hover .ci,.cover:focus-visible .ci{transform:scale(1.04);filter:brightness(1)}
.packmark{position:absolute;left:0;right:0;top:calc(13vh + env(safe-area-inset-top));text-align:center;z-index:5;opacity:0;transform:translateY(6px);transition:opacity 2s ease,transform 2s ease;pointer-events:none;text-shadow:0 0 2px rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.6)}
.packmark.on{opacity:1;transform:none}
.packmark .pn{font-style:italic;font-weight:300;font-size:clamp(26px,2.6vw,34px);color:#efe2c8}
.packmark .pc{font-size:11px;letter-spacing:.3em;color:#cfb98f;margin-top:6px}
@media (max-width:700px){.covers{grid-template-columns:1fr 1fr;justify-content:stretch;gap:12px}.cover .cn{font-size:26px;left:14px;right:14px;bottom:34px}.cover .cc{left:14px;right:8px;bottom:14px;font-size:9.5px;letter-spacing:.12em;white-space:nowrap}}
.back{position:absolute;top:calc(22px + env(safe-area-inset-top));left:24px;font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:#8a7e6c;z-index:5}
.back:hover{color:#efe6d6}
.thresh{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;padding:24px 24px 60px}
.thresh .k{font-family:'Cormorant SC',serif;letter-spacing:.4em;font-size:13px;color:#8d8170;padding-left:.4em}
.thresh h2{font-weight:300;font-size:clamp(36px,5vw,64px);color:#f1e7d4;opacity:0;animation:fadeIn 2.4s ease .6s forwards}
.thresh .lens{opacity:0;animation:fadeIn 2s ease 2.2s forwards;margin-top:0}

/* Moment: passage, reveal and rest */
.pz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10vh 5vw 20vh;pointer-events:none;z-index:4}
.pz .lines{font-weight:400;font-size:var(--cf,44px);line-height:1.28;color:#f7eee0;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.pz .ln{display:block;width:max-content;margin:0 auto;white-space:nowrap;opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 2.1s ease,filter 2.1s ease,transform 2.1s ease;transform-origin:0 0}
.pz .ln.on{opacity:1;filter:blur(0);transform:none}
.pz .who,.pz .art{width:max-content;max-width:90vw;margin:0 auto;transform-origin:0 0;opacity:0;transition:opacity 2.4s}
.pz .who{margin-top:4.5vh;font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:14px;color:#cfb98f}
.pz .art{margin-top:10px;font-style:italic;font-size:15px;color:rgba(232,220,198,.6)}
.pz .who.on,.pz .art.on{opacity:1}
.pz.rest{inset:auto;left:calc(26px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));align-items:flex-start;text-align:left;padding:0;pointer-events:auto;cursor:pointer;max-width:min(440px,44vw)}
.pz.rest .lines{font-size:var(--rf,18px);line-height:1.38;text-shadow:0 0 2px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.4)}
.pz.rest .ln{margin:0}
.pz.rest .who{margin:12px 0 0;font-size:11px;letter-spacing:.24em;width:auto;max-width:100%;text-shadow:0 0 2px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.4)}
.pz.rest .art{margin:4px 0 0;font-size:13.5px;width:auto;max-width:100%;color:rgba(240,230,212,.85);text-shadow:0 0 2px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.4)}
:root{--pc:8,6,4;--pa:.3}
.pz.rest .lines,.pz.rest .who,.pz.rest .art,.sp,.sp .credit,.sp .prog{transition:color 1.6s ease,text-shadow 1.6s ease}
.ink{--pc:250,245,234}
.pz.rest.ink .lines{color:#1f1913;text-shadow:0 0 2px rgba(255,250,240,.7),0 0 14px rgba(255,250,240,.6),0 0 30px rgba(255,250,240,.4)}
.pz.rest.ink .who{color:#6a3b1c;text-shadow:0 0 2px rgba(255,250,240,.7),0 0 12px rgba(255,250,240,.6)}
.pz.rest.ink .art{color:rgba(31,25,19,.8);text-shadow:0 0 2px rgba(255,250,240,.7),0 0 12px rgba(255,250,240,.6)}
.sp.ink{color:#1f1913;text-shadow:0 0 2px rgba(255,250,240,.7),0 0 14px rgba(255,250,240,.6)}
.sp.ink .credit{color:#6a3b1c}.sp.ink .prog{color:rgba(31,25,19,.75)}.sp.ink .track{background:rgba(31,25,19,.25)}.sp.ink .fill{background:rgba(31,25,19,.8)}.sp.ink .ctl button{color:#1f1913}.sp.ink .bars i{background:#7a4a22}
.pz.gone{opacity:0;transition:opacity 1.4s}
.plate{position:absolute;z-index:3;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(var(--pc),var(--pa)) 0%,rgba(var(--pc),calc(var(--pa) * .66)) 50%,rgba(var(--pc),calc(var(--pa) * .22)) 78%,rgba(var(--pc),0) 100%);transition:opacity 1.6s ease;opacity:0;transition:opacity 1.6s ease;pointer-events:none}
.plate.on{opacity:1}

/* top-left quiet controls */
.top{position:absolute;top:calc(20px + env(safe-area-inset-top));left:24px;display:flex;gap:22px;align-items:baseline;font-family:'Cormorant SC',serif;font-size:12px;letter-spacing:.3em;color:rgba(239,230,214,.78);text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity 1.4s;z-index:6}
.top .where{color:rgba(239,230,214,.5)}
.idle .top{opacity:0}

/* Sound player, bottom right */
.sp{position:absolute;right:calc(26px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:min(300px,40vw);z-index:6;text-align:right;color:#f1e8d8;text-shadow:0 0 2px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.4)}
.sp:before{content:'';position:absolute;inset:-46px -56px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(var(--pc),var(--pa)) 0%,rgba(var(--pc),calc(var(--pa) * .66)) 50%,rgba(var(--pc),calc(var(--pa) * .22)) 78%,rgba(var(--pc),0) 100%);transition:opacity 1.6s ease;z-index:-1;pointer-events:none}
.sp .row{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.sp .title{font-style:italic;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .credit{font-family:'Cormorant SC',serif;font-size:11px;letter-spacing:.2em;color:#cfb98f;margin-top:3px;line-height:1.5}
.sp .prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:rgba(239,230,214,.7);font-variant-numeric:tabular-nums lining-nums}
.sp .track{flex:1;height:1px;background:rgba(239,230,214,.25);position:relative}
.sp .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,236,205,.85)}
.sp .ctl{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.sp .ctl button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#f1e8d8;opacity:.85;transition:background .6s,opacity .6s}
.sp .ctl button:hover{background:rgba(255,236,205,.1);opacity:1}
.sp .ctl button[hidden]{display:none}
.sp .state{font-style:italic;font-size:13px;color:rgba(239,230,214,.6);margin-right:auto;align-self:center}
.sp.silent .title{color:rgba(239,230,214,.7)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px;width:15px;flex:none}
.bars i{display:block;width:2px;height:3px;background:#ffdcaa;border-radius:1px;opacity:.85}
.bars.on i{animation:lvl 1.1s ease-in-out infinite alternate}
.bars.on i:nth-child(2){animation-duration:.8s;animation-delay:-.3s}
.bars.on i:nth-child(3){animation-duration:1.3s;animation-delay:-.6s}
.bars.on i:nth-child(4){animation-duration:.95s;animation-delay:-.2s}
@keyframes lvl{0%{height:3px}50%{height:11px}100%{height:6px}}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* ending */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:#000}
.end .candle{opacity:0;animation:fadeIn 3s ease .4s forwards}
.end button{font-family:'Cormorant SC',serif;letter-spacing:.42em;font-size:14px;color:#a0937e;padding:12px 18px 12px calc(18px + .42em);opacity:0;animation:fadeIn 2.4s ease 2.6s forwards}
.end button:hover{color:#efe6d6}

@media (max-width:700px){
  .home-credit{max-width:none;right:26px;bottom:calc(84px + env(safe-area-inset-bottom));font-size:14px;text-align:center}
  .soundcheck{left:0;right:0;justify-content:center;bottom:calc(26px + env(safe-area-inset-bottom))}
  .sp{left:calc(18px + env(safe-area-inset-left));right:calc(18px + env(safe-area-inset-right));width:auto;bottom:calc(22px + env(safe-area-inset-bottom));text-align:left}
  .sp .row{justify-content:flex-start}
  .sp .ctl{position:absolute;right:0;top:-4px;margin:0}
  .sp .title{padding-right:110px}
  .sp .credit{padding-right:110px}
  .pz.rest{left:calc(18px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));max-width:calc(100vw - 36px)}
  .pz .who{letter-spacing:.18em}
  .top .where{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="yt-wrap"><div id="yt"></div></div><div id="yt-ask">This browser needs one tap on the video to play its Sound</div>
<div id="proto"></div>
<script>
/* ===================== DATA: shaped like a real pack file ===================== */
const PACKS = [
  {
    id: "advent",
    name: "Advent",
    curator: "Splendor",
    added: "2026-11-22",
    tags: ["sacred", "advent", "waiting", "chant"],
    description: "Waiting in the dark for the light that is coming. For the four weeks from Sunday 29 November.",
    moments: [
      {
        sound: { title: "O Come, O Come, Emmanuel", credit: "St. Martin's Chamber Choir", youtube: "https://www.youtube.com/watch?v=z2OcqXQT9_o" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Gerard_van_Honthorst_-_Adoration_of_the_Shepherds_%281622%29.jpg/1920px-Gerard_van_Honthorst_-_Adoration_of_the_Shepherds_%281622%29.jpg", title: "Adoration of the Shepherds, 1622", credit: "Gerard van Honthorst" },
        passage: { text: "The people that walked in darkness\nhave seen a great light:\nthey that dwell in the land\nof the shadow of death,\nupon them hath the light shined.", credit: "Isaiah 9:2", source: "King James Version" }
      },
      {
        sound: { title: "Sicut cervus", credit: "Palestrina, sung by The Cambridge Singers", youtube: "https://www.youtube.com/watch?v=jAjNZ4ug1j8" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/La_Anunciaci%C3%B3n_%28Fra_Angelico-Prado%29.jpg/1920px-La_Anunciaci%C3%B3n_%28Fra_Angelico-Prado%29.jpg", title: "The Annunciation, c. 1426", credit: "Fra Angelico" },
        passage: { text: "Behold the handmaid of the Lord;\nbe it unto me\naccording to thy word.", credit: "Luke 1:38", source: "King James Version" }
      },
      {
        sound: { title: "O Oriens", credit: "Chanted by the English Dominicans (Godzdogz)", youtube: "https://www.youtube.com/watch?v=HAUzuw1l-7U" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Georges_de_La_Tour_-_Newlyborn_infant_-_Mus%C3%A9e_des_Beaux-Arts_de_Rennes.jpg/1920px-Georges_de_La_Tour_-_Newlyborn_infant_-_Mus%C3%A9e_des_Beaux-Arts_de_Rennes.jpg", title: "The Newborn Child, c. 1648", credit: "Georges de La Tour" },
        passage: { text: "O Dayspring,\nsplendour of light eternal\nand sun of righteousness:\ncome and enlighten those who sit in darkness\nand in the shadow of death.", credit: "O Antiphon for 21 December", source: "Traditional English" }
      },

  app.appendChild(s);
}
function Threshold(p) {
  let pick = null;
  const s = el('<div class="screen fade-in"><button class="back">Back</button><div class="thresh">' + candle + '<div class="k"></div><h2>How long do you have?</h2><div class="lensbox"></div><button class="enter wait">Enter</button></div></div>');
  s.querySelector('.k').textContent = p.name;
  const enter = s.querySelector('.enter');
  s.querySelector('.lensbox').appendChild(lengthChooser(v => { pick = v; enter.classList.remove('wait'); }, null, [[5, 'Five minutes'], [10, 'Ten'], [15, 'Fifteen'], [0, 'Just play']]));
  s.querySelector('.back').onclick = openLibrary;
  enter.onclick = () => { if (pick !== null) begin(p.id, 0, pick); };
  app.appendChild(s);
}
function End() {
  const s = el('<div class="screen end">' + candle + '<button>Return</button></div>');
  s.querySelector('button').onclick = goHome;
  app.appendChild(s);
}

/* ---------- the Moment screen ---------- */
const Moment = {
  mount() {
    const s = el('<div class="screen stage"><div class="layers"></div><div class="vignette"></div><div class="top"><button data-a="leave">Leave</button><span class="where"></span></div>' +
      '<div class="sp"><div class="row"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="title"></span></div><div class="credit"></div>' +
      '<div class="prog"><span class="t0">0:00</span><div class="track"><div class="fill"></div></div><span class="t1"></span></div>' +
      '<div class="ctl"><button data-a="pause" aria-label="Pause">' + IC.pause + '</button><button data-a="next" aria-label="Next Moment">' + IC.next + '</button><button data-a="mute" aria-label="Mute">' + IC.on + '</button></div></div></div>');
    s.querySelector('[data-a=leave]').onclick = goHome;
    s.querySelector('[data-a=pause]').onclick = togglePause;
    s.querySelector('[data-a=next]').onclick = next;
    s.querySelector('[data-a=mute]').onclick = () => setMuted(!S.muted);
    app.appendChild(s);
    wake();
    Moment.show(cur(), true);
  },
  show(m, fresh, changed) {
    const s = app.querySelector('.stage'); if (!s) return;
    s.classList.remove('rest');
    s.querySelectorAll('.pz').forEach(o => { o.classList.add('gone'); setTimeout(() => o.remove(), 1500); });
    s.querySelectorAll('.plate').forEach(o => { o.classList.remove('on'); setTimeout(() => o.remove(), 1700); });
    const roman = ['i', 'ii', 'iii', 'iv', 'v', 'vi'];
    const seg = S.plan.filter(x => x.p === S.packId), k = seg.indexOf(item());
    s.querySelector('.where').textContent = pack().name + ' · ' + (roman[k] || k + 1) + ' of ' + (roman[seg.length - 1] || seg.length);
    s.querySelectorAll('.packmark').forEach(o => o.remove());
    if (changed) {
      const pm = el('<div class="packmark"><div class="pn"></div><div class="pc sc"></div></div>');
      pm.querySelector('.pn').textContent = pack().name; pm.querySelector('.pc').textContent = 'gathered by ' + pack().curator;
      s.insertBefore(pm, s.querySelector('.top'));
      raf2(() => pm.classList.add('on'));
      setTimeout(() => { pm.classList.remove('on'); setTimeout(() => pm.remove(), 2200); }, FAST ? 3500 : 5500);
    }
    const sp = s.querySelector('.sp');
    tone(sp, 0, false);
    sp.classList.toggle('silent', !m.sound);
    sp.querySelector('.title').textContent = m.sound ? m.sound.title : 'Silence';
    sp.querySelector('.credit').textContent = m.sound ? m.sound.credit : '';
    sp.querySelector('[data-a=mute]').hidden = !m.sound;
    const live = M = { m, phase: 'reveal', shown: 0, restAt: Infinity, whoAt: Infinity, hasImage: false, pz: null, plate: null };
    imageOk(m.image).then(ok => {
      if (M !== live) return;
      live.hasImage = ok;
      const layers = s.querySelector('.layers');
      let layer;
      if (ok) { layer = el('<div class="img drift' + (1 + (S.pos % 3)) + '"></div>'); layer.style.backgroundImage = 'url("' + m.image.url + '")'; }
      else layer = el('<div class="backdrop"><div style="transform:scale(1.6);transform-origin:top center">' + candle + '</div></div>');
      layers.appendChild(layer);
      raf2(() => layer.classList.add('show'));
      [...layers.children].filter(x => x !== layer).forEach(x => { x.classList.remove('show'); setTimeout(() => x.remove(), 3100); });
      if (!m.passage) { live.restAt = elapsed() + 3; return; }
      const pz = el('<div class="pz"><div class="lines"></div><div class="who"></div><div class="art"></div></div>');
      const lines = m.passage.text.split('\n');
      lines.forEach(l => { const sp2 = el('<span class="ln"></span>'); sp2.textContent = l; pz.querySelector('.lines').appendChild(sp2); });
      pz.querySelector('.who').textContent = m.passage.credit + ' · ' + m.passage.source;
      const art = pz.querySelector('.art');
      if (m.image) art.textContent = ok ? m.image.credit + ', ' + m.image.title : 'The Image could not load'; else art.remove();
      pz.onclick = () => Moment.recall();
      s.insertBefore(pz, s.querySelector('.top'));
      live.pz = pz;
      Moment.fit(pz, lines.length);
      const gap = FAST ? 1.1 : (lines.length > 6 ? 2.1 : 2.7), start = elapsed() + (fresh ? 1.4 : (changed ? 3 : 2.2));
      live.lineAt = lines.map((_, i) => start + i * gap);
      live.whoAt = start + (lines.length - 1) * gap + gap * .8;
      const lastAt = start + (lines.length - 1) * gap;
      live.restAt = ok ? lastAt + (FAST ? Math.max(2.5, lines.length * 0.8) : Math.max(4, 2 * lines.length)) : Infinity;
    });
  },
  fit(pz, n) {
    const W = innerWidth, phone = W <= 700;
    let base = Math.min(52, Math.max(27, W * 0.035)); if (n > 6) base *= .74;
    pz.style.setProperty('--cf', base + 'px');
    const widest = Math.max(...[...pz.querySelectorAll('.ln')].map(x => x.scrollWidth));
    const avail = W * (phone ? .88 : .8);
    if (widest > avail) pz.style.setProperty('--cf', (base * avail / widest) + 'px');
    pz.style.setProperty('--rf', (phone ? (n > 6 ? 13.5 : 15) : (n > 6 ? 15.5 : 18)) + 'px');
  },
  morph(toRest) {
    const live = M, pz = live.pz, s = app.querySelector('.stage');
    if (!pz) { s.classList.toggle('rest', toRest); if (live.hasImage) tone(s.querySelector('.sp'), cornerLum(live.m.image.url).br, toRest); return; }
    const els = [...pz.querySelectorAll('.ln, .who, .art')];
    const F = els.map(e => [e.getBoundingClientRect(), parseFloat(getComputedStyle(e).fontSize)]);
    pz.classList.toggle('rest', toRest);
    s.classList.toggle('rest', toRest);
    const L = els.map(e => [e.getBoundingClientRect(), parseFloat(getComputedStyle(e).fontSize)]);
    els.forEach((e, i) => {
      const [f, ff] = F[i], [l, lf] = L[i];
      e.animate([{ transform: 'translate(' + (f.left - l.left) + 'px,' + (f.top - l.top) + 'px) scale(' + (ff / lf) + ')' }, { transform: 'translate(0,0) scale(1)' }], { duration: MORPH, easing: 'cubic-bezier(.62,0,.24,1)' });
    });
    if (!live.plate) { live.plate = el('<div class="plate"></div>'); s.insertBefore(live.plate, pz); }
    const L2 = live.hasImage ? cornerLum(live.m.image.url) : { bl: .2, br: .2 };
    tone(pz, L2.bl, toRest); tone(live.plate, L2.bl, toRest); tone(s.querySelector('.sp'), L2.br, toRest);
    if (toRest) { Moment.placePlate(); setTimeout(() => M === live && live.phase === 'rest' && live.plate.classList.add('on'), MORPH * .45); }
    else live.plate.classList.remove('on');
  },
  placePlate() {
    const live = M; if (!live || !live.plate || !live.pz) return;
    const r = live.pz.getBoundingClientRect(), pad = 56;
    Object.assign(live.plate.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
  },
  recall() {
    const live = M; if (!live || live.phase !== 'rest') return;
    live.phase = 'recall'; Moment.morph(false);
    live.restAt = elapsed() + Math.max(6, 2 * live.m.passage.text.split('\n').length) * (FAST ? .4 : 1);
  },
  tick() {
    const s = app.querySelector('.stage'); if (!s) return;
    const live = M;
    if (live) {
      const e = elapsed();
      if (live.pz && live.lineAt) {
        const spans = live.pz.querySelectorAll('.ln');
        live.lineAt.forEach((t, i) => { if (e >= t && !spans[i].classList.contains('on')) spans[i].classList.add('on'); });
        if (e >= live.whoAt) live.pz.querySelectorAll('.who,.art').forEach(x => x.classList.add('on'));
      }
      if (e >= live.restAt && live.phase !== 'rest' && !S.ending) { live.phase = 'rest'; live.restAt = Infinity; if (live.pz) live.pz.querySelectorAll('.ln,.who,.art').forEach(x => x.classList.add('on')); Moment.morph(true); }
    }
    const sp = s.querySelector('.sp'), t = soundTimes(), m = cur();
    let el0 = 0, len = 0;
    if (m.sound && t) { el0 = t[0]; len = t[1]; } else { el0 = elapsed(); len = S.momentLen; }
    sp.querySelector('.t0').textContent = fmt(el0);
    sp.querySelector('.t1').textContent = len ? '−' + fmt(len - el0) : '';
    sp.querySelector('.fill').style.width = (len ? Math.min(100, el0 / len * 100) : 0) + '%';
    sp.querySelector('.bars').classList.toggle('on', !!m.sound && S.sound === 'playing' && !S.muted && !S.paused);
    sp.querySelector('.bars').style.opacity = m.sound ? 1 : 0;
    sp.querySelector('[data-a=pause]').innerHTML = S.paused ? IC.play : IC.pause;
    sp.querySelector('[data-a=mute]').innerHTML = S.muted ? IC.off : IC.on;
    const cr = sp.querySelector('.credit');
    const note = !m.sound ? '' : S.sound === 'unavailable' ? ' · could not play' : S.sound === 'blocked' ? ' · tap play' : S.sound === 'loading' ? ' · loading' : '';
    if (m.sound && cr.textContent !== m.sound.credit + note) cr.textContent = m.sound.credit + note;
  }
};

let idleT = null;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3200); };
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
document.addEventListener('keydown', e => {
  if (S.screen !== 'moment') return;
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'ArrowRight') next();
});
addEventListener('resize', () => { if (M && M.pz && M.phase !== 'rest') Moment.fit(M.pz, M.m.passage.text.split('\n').length); if (M && M.phase === 'rest') Moment.placePlate(); });

(document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
(() => { const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); })();
</script>
