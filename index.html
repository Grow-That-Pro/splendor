<!doctype html>
<!--
  PROTOTYPE — throwaway. Not production code.
  Plan: one page, three radically different ways to receive a Moment on Splendor
  (A Gallery, B Chapel, C Book), switchable with ?variant=A|B|C and the floating bar at the bottom.
  Add ?fast=1 to make every Moment 15 seconds and Sessions short, for testing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splendor — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0}
.fade-in{animation:fadeIn 1.8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dark-veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition-property:opacity;transition-timing-function:linear}
.dark-veil.on{opacity:1}

/* hidden YouTube player */
#yt-wrap{position:fixed;left:0;bottom:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}

/* ---------- prototype switcher (deliberately not part of any design) ---------- */
#proto{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:#0d0d0f;color:#f4f4f5;border:1px solid #3f3f46;box-shadow:0 6px 24px rgba(0,0,0,.35);font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;user-select:none}
#proto button{width:28px;height:28px;border-radius:999px;font-size:14px;color:#f4f4f5}
#proto button:hover{background:#27272a}
#proto .lbl{padding:0 8px;white-space:nowrap}
#proto .st{padding:0 10px 0 8px;border-left:1px solid #3f3f46;color:#a1a1aa;font-weight:400;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
#proto .tag{background:#facc15;color:#111;border-radius:999px;padding:4px 7px;font-size:10px;letter-spacing:.06em}
@media (max-width:560px){#proto .st{display:none}}

/* =====================================================================
   A · GALLERY
   ===================================================================== */
.vA{background:#e9e6df;color:#1d1b18;font-family:'EB Garamond',serif}
.a-home{position:absolute;inset:0;overflow-y:auto;padding:clamp(28px,6vh,72px) clamp(22px,6vw,96px) 120px}
.a-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}
.a-mark{font-family:'Inter',sans-serif;font-weight:500;font-size:12px;letter-spacing:.32em;text-transform:uppercase}
.a-sub{font-family:'Inter',sans-serif;font-weight:300;font-size:12px;letter-spacing:.04em;color:#6b665d}
.a-wall{display:flex;justify-content:center;align-items:flex-end;gap:clamp(28px,4.5vw,84px);flex-wrap:wrap;min-height:calc(100% - 60px);padding-top:clamp(40px,10vh,120px)}
.a-work{cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:18px;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.a-work:hover{transform:translateY(-4px)}
.a-frame{background:#1b1a18;padding:0;box-shadow:0 1px 1px rgba(0,0,0,.08),0 18px 40px -18px rgba(0,0,0,.45),0 40px 80px -40px rgba(0,0,0,.35)}
.a-frame img{display:block;height:clamp(180px,28vh,300px);width:auto;max-width:min(72vw,360px);object-fit:cover}
.a-work:nth-child(2) .a-frame img{height:clamp(220px,38vh,400px)}
.a-label{font-family:'Inter',sans-serif;max-width:240px}
.a-label .t{font-size:13px;font-weight:500;letter-spacing:.01em}
.a-label .c{font-size:11px;color:#6b665d;margin-top:4px;font-weight:300}
.a-label .d{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:#4b473f;margin-top:8px;line-height:1.4}
.a-room{position:absolute;inset:0;background:#e9e6df;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);align-items:center;gap:clamp(28px,6vw,96px);padding:clamp(28px,6vw,96px)}
.a-room .a-frame img{height:auto;width:100%;max-height:72vh;object-fit:contain;max-width:100%}
.a-room .a-frame{justify-self:end;max-width:100%}
.a-panel{max-width:420px}
.a-kicker{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#6b665d}
.a-panel h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(44px,5vw,68px);line-height:1;margin:18px 0 14px}
.a-panel .cur{font-family:'Inter',sans-serif;font-size:12px;color:#6b665d;font-weight:300}
.a-panel p{font-size:19px;line-height:1.55;margin:22px 0 34px;color:#38342e}
.a-choose{font-family:'Inter',sans-serif;font-size:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.a-choose button{padding:9px 14px;border:1px solid #c9c3b7;border-radius:2px;letter-spacing:.04em;transition:all .6s}
.a-choose button.on{background:#1d1b18;color:#f5f2ea;border-color:#1d1b18}
.a-begin{margin-top:28px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;padding:16px 0;border-bottom:1px solid #1d1b18}
.a-back{position:absolute;top:28px;left:clamp(22px,6vw,96px);font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6b665d}
.a-stage{position:absolute;inset:0;background:#161513}
.a-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.6s ease}
.a-img.show{opacity:1}
.a-walltext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8vw;background:#2c312d;opacity:0;transition:opacity 2.6s ease}
.a-walltext.show{opacity:1}
.a-walltext blockquote{font-family:'Cormorant Garamond',serif;font-weight:300;color:#ecebe4;font-size:clamp(32px,4.4vw,64px);line-height:1.15;max-width:18ch;text-wrap:balance}
.a-walltext cite{display:block;margin-top:28px;font-family:'Inter',sans-serif;font-style:normal;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#a7aba3}
.a-placard{position:absolute;left:clamp(14px,3vw,40px);bottom:clamp(64px,7vh,72px);width:min(380px,calc(100vw - 28px));background:rgba(246,243,236,.96);color:#1d1b18;padding:22px 24px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease}
.a-placard.show{opacity:1;transform:none}
.a-placard .pp{font-size:17px;line-height:1.5;text-wrap:pretty}
.a-placard .pc{font-family:'Inter',sans-serif;font-size:11px;color:#57524a;margin-top:10px}
.a-meta{margin-top:16px;padding-top:12px;border-top:1px solid #d8d2c6;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-family:'Inter',sans-serif;font-size:10.5px;line-height:1.45;color:#3c3832}
.a-meta dt{letter-spacing:.18em;text-transform:uppercase;color:#8b857a;font-size:9.5px;padding-top:1px}
.a-meta em{font-style:italic}
.a-ctl{position:absolute;top:22px;right:clamp(14px,3vw,40px);display:flex;gap:22px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.86);text-shadow:0 1px 8px rgba(0,0,0,.6);transition:opacity 1.2s}
.a-ctl .where{color:rgba(255,255,255,.55);letter-spacing:.12em}
.idle .a-ctl{opacity:0}
.a-line{position:absolute;left:0;bottom:0;height:1px;background:rgba(255,255,255,.4);width:0;transition:width .25s linear}
.a-end{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:10vw;text-align:center}
.a-end q{font-style:italic;font-size:clamp(24px,2.6vw,34px);color:#e9e5dc;line-height:1.35;max-width:26ch;quotes:none;opacity:0;animation:fadeIn 3s ease 1.2s forwards}
.a-end .s{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#77736a}
.a-end button{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#a29d93;opacity:0;animation:fadeIn 2s ease 4s forwards}
@media (max-width:760px){
  .a-room{grid-template-columns:1fr;align-content:start;overflow-y:auto;padding-top:72px;padding-bottom:110px}
  .a-room .a-frame{justify-self:start}.a-room .a-frame img{max-height:40vh}
  .a-placard{padding:16px 18px 14px}.a-placard .pp{font-size:16px}
  .a-ctl{gap:16px}.a-ctl .where{display:none}
}

/* =====================================================================
   B · CHAPEL
   ===================================================================== */
.vB{background:#070605;color:#efe6d6;font-family:'Cormorant Garamond',serif}
.b-home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding:40px 24px 100px;text-align:center;overflow-y:auto}
.b-glow{position:absolute;left:50%;top:22%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,170,80,.11) 0%,rgba(255,140,60,.04) 22%,transparent 50%);pointer-events:none;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7}}
.candle{position:relative;width:14px;height:58px;margin:0 auto}
.candle .wax{position:absolute;bottom:0;left:2px;width:10px;height:30px;background:linear-gradient(90deg,#c9b89a,#efe3c9 45%,#b4a283);border-radius:2px 2px 0 0}
.candle .wick{position:absolute;bottom:30px;left:6.5px;width:1px;height:5px;background:#2a2016}
.candle .flame{position:absolute;bottom:33px;left:1px;width:12px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 75%,#fff7e0 0%,#ffd27a 35%,#ff9d3a 65%,rgba(255,120,40,0) 75%);filter:blur(.4px);transform-origin:50% 100%;animation:flicker 2.8s ease-in-out infinite}
.candle .halo{position:absolute;bottom:20px;left:-43px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,110,.28),rgba(255,160,70,.08) 40%,transparent 70%);animation:breathe 3.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(.96,1.04) rotate(-1.5deg)}45%{transform:scale(1.03,.97) rotate(1deg)}70%{transform:scale(.98,1.05) rotate(-.6deg)}}
.b-name{font-family:'Cormorant SC',serif;font-weight:500;letter-spacing:.55em;font-size:15px;color:#d9c7a6;padding-left:.55em}
.b-invite{font-style:italic;font-weight:300;font-size:clamp(22px,2.4vw,30px);color:#bfb19a}
.b-packs{display:flex;flex-direction:column;gap:3.2vh;margin-top:2vh}
.b-pack{display:block;transition:color 1.2s,text-shadow 1.2s;color:#cdbfa8}
.b-pack .n{display:block;font-weight:300;font-size:clamp(38px,5vw,62px);line-height:1;letter-spacing:.01em}
.b-pack .c{display:block;font-family:'Cormorant SC',serif;font-size:13px;letter-spacing:.3em;color:#7d7262;margin-top:8px}
.b-pack:hover{color:#fff3dc;text-shadow:0 0 30px rgba(255,180,90,.45)}
.b-thresh{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;padding:24px 24px 110px}
.b-thresh .k{font-family:'Cormorant SC',serif;letter-spacing:.4em;font-size:13px;color:#8d8170;padding-left:.4em}
.b-thresh h2{font-weight:300;font-size:clamp(36px,5vw,64px);color:#f1e7d4;opacity:0;animation:fadeIn 2.4s ease .6s forwards}
.b-opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 34px;opacity:0;animation:fadeIn 2s ease 2.2s forwards}
.b-opts button{font-style:italic;font-size:clamp(21px,2vw,26px);color:#a99c87;padding:6px 2px;border-bottom:1px solid transparent;transition:all 1s}
.b-opts button:hover{color:#efe6d6}
.b-opts button.on{color:#fff1d6;border-bottom-color:rgba(255,200,130,.6);text-shadow:0 0 24px rgba(255,180,90,.4)}
.b-enter{font-family:'Cormorant SC',serif;font-size:15px;letter-spacing:.5em;padding:18px 34px 18px calc(34px + .5em);border:1px solid rgba(239,230,214,.35);border-radius:999px;opacity:0;pointer-events:none;transition:opacity 1.6s,border-color 1s,background 1s}
.b-enter.ready{opacity:1;pointer-events:auto}
.b-enter:hover{border-color:rgba(255,210,150,.8);background:rgba(255,190,110,.06)}
.b-back{position:absolute;top:24px;left:24px;font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:#6f6556}
.b-stage{position:absolute;inset:0;background:#050403;overflow:hidden}
.b-img{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;transition:opacity 3s ease;filter:brightness(.42) saturate(.78) sepia(.2) contrast(1.05)}
.b-img.show{opacity:1}
.b-img.drift1{animation:kb1 70s ease-in-out infinite alternate}
.b-img.drift2{animation:kb2 70s ease-in-out infinite alternate}
.b-img.drift3{animation:kb3 70s ease-in-out infinite alternate}
@keyframes kb1{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2.5%,-1.5%)}}
@keyframes kb2{from{transform:scale(1.15) translate(2%,1%)}to{transform:scale(1.04) translate(-1%,0)}}
@keyframes kb3{from{transform:scale(1.06) translate(-1.5%,1.5%)}to{transform:scale(1.17) translate(1.5%,-1%)}}
.paused .b-img,.paused .flame{animation-play-state:paused}
.b-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.86) 100%);pointer-events:none}
.b-backdrop{position:absolute;inset:0;display:flex;justify-content:center;padding-top:12vh;opacity:0;transition:opacity 3s}
.b-backdrop.show{opacity:1}
.b-passage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10vh 7vw 18vh;pointer-events:none}
.b-passage .lines{font-weight:400;font-size:clamp(27px,3.5vw,52px);line-height:1.28;color:#f5ecdc;text-shadow:0 2px 30px rgba(0,0,0,.6);max-width:min(92vw,34ch)}
.b-passage .ln{display:block;opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 2.6s ease,filter 2.6s ease,transform 2.6s ease}
.b-passage .ln.on{opacity:1;filter:blur(0);transform:none}
.b-passage .who{margin-top:4.5vh;font-family:'Cormorant SC',serif;letter-spacing:.32em;font-size:14px;color:#c2ae8b;opacity:0;transition:opacity 2.6s}
.b-passage .who.on{opacity:1}
.b-passage.out{opacity:0;transition:opacity 1.6s}
.b-credits{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:15px;color:rgba(232,220,198,.5);padding:0 20px;line-height:1.5;transition:opacity 1.5s}
.b-ctl{position:absolute;left:0;right:0;bottom:calc(132px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:34px;font-family:'Cormorant SC',serif;font-size:14px;letter-spacing:.32em;color:#d8c8ab;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
.b-ctl.on{opacity:1;pointer-events:auto}
.b-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:38px;padding:24px 8vw 110px;background:#000}
.b-end .candle{opacity:0;animation:fadeIn 3s ease .4s forwards}
.b-end q{quotes:none;font-style:italic;font-weight:300;font-size:clamp(28px,3.4vw,46px);line-height:1.25;max-width:22ch;color:#efe4cf;opacity:0;animation:fadeIn 3.2s ease 1.6s forwards}
.b-end .peace{font-family:'Cormorant SC',serif;letter-spacing:.45em;font-size:13px;color:#8a7e6c;opacity:0;animation:fadeIn 2.4s ease 4.2s forwards}
.b-end button{font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:#6f6556;opacity:0;animation:fadeIn 2s ease 6s forwards}

/* =====================================================================
   C · BOOK
   ===================================================================== */
.vC{--paper:#f3ecdc;--paper2:#ece3cf;--ink:#2a231b;--soft:#6e6252;--rubric:#a3341f;--gold:#a8823a;
  background:#d9cfbb radial-gradient(ellipse at 50% 30%,#e8dfcb 0%,#d6cbb5 70%,#c9bda4 100%);color:var(--ink);font-family:'EB Garamond',serif}
.c-paper{background-color:var(--paper);background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.c-scroll{position:absolute;inset:0;overflow-y:auto;padding:clamp(18px,5vh,56px) 16px 110px}
.c-page{max-width:720px;margin:0 auto;padding:clamp(40px,8vh,90px) clamp(26px,7vw,90px) clamp(48px,8vh,80px);box-shadow:0 1px 2px rgba(60,40,20,.12),0 30px 60px -30px rgba(60,40,20,.45);position:relative}
.c-small{font-family:'Cormorant SC',serif;font-weight:500;letter-spacing:.34em;font-size:13px;color:var(--soft);text-align:center;padding-left:.34em}
.c-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(56px,9vw,96px);line-height:1;text-align:center;margin:18px 0 6px;letter-spacing:.01em}
.c-title .r{color:var(--rubric)}
.c-sub{text-align:center;font-style:italic;font-size:19px;color:var(--soft)}
.c-orn{display:block;margin:34px auto;text-align:center;color:var(--rubric);font-size:22px;letter-spacing:.6em;padding-left:.6em}
.c-toc h3{font-family:'Cormorant SC',serif;font-weight:500;letter-spacing:.34em;font-size:14px;text-align:center;color:var(--rubric);margin-bottom:26px;padding-left:.34em}
.c-entry{display:block;width:100%;text-align:left;padding:16px 0 18px;border-top:1px solid rgba(42,35,27,.12);cursor:pointer}
.c-entry:last-child{border-bottom:1px solid rgba(42,35,27,.12)}
.c-row{display:flex;align-items:baseline;gap:14px;font-size:clamp(22px,2.4vw,27px)}
.c-row .num{font-family:'Cormorant SC',serif;color:var(--rubric);width:2.2em;flex:none;font-size:.85em;letter-spacing:.08em}
.c-row .lead{flex:1;border-bottom:1.5px dotted rgba(42,35,27,.35);transform:translateY(-6px);min-width:20px}
.c-row .pg{font-variant-numeric:oldstyle-nums;color:var(--soft);font-size:.85em}
.c-entry .desc{margin:4px 0 0 calc(2.2em * .85 + 14px);font-style:italic;color:var(--soft);font-size:17px;line-height:1.45}
.c-entry:hover .t{color:var(--rubric)}
.c-entry .t{transition:color .8s}
.drop{float:left;font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--rubric);font-size:4.6em;line-height:.8;padding:.08em .1em 0 0;margin-right:.06em}
.drop.boxed{border:1px solid var(--gold);padding:.12em .16em .02em;margin:.1em .14em 0 0;background:linear-gradient(135deg,rgba(168,130,58,.10),rgba(168,130,58,.02));box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px rgba(168,130,58,.5)}
.c-chapter p.body{font-size:21px;line-height:1.6;text-align:justify;hyphens:auto;margin-top:34px}
.c-how{margin-top:44px;text-align:center}
.c-how .q{font-style:italic;font-size:19px;color:var(--soft)}
.c-how .opts{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;font-size:22px}
.c-how .opts button{color:var(--ink);border-bottom:1px solid rgba(163,52,31,.35);padding-bottom:2px;transition:color .6s,border-color .6s}
.c-how .opts button:hover{color:var(--rubric);border-color:var(--rubric)}
.c-back{display:block;margin:0 auto 26px;font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:var(--soft)}
.c-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vh,44px) clamp(10px,3vw,40px) 120px}
.c-book{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(1240px,100%);height:min(780px,100%);perspective:2600px}
.c-leafwrap{position:relative;overflow:hidden}
.c-pg{position:absolute;inset:0;padding:clamp(28px,5vh,54px) clamp(26px,3.6vw,58px) clamp(30px,5vh,48px);display:flex;flex-direction:column}
.c-left{border-radius:3px 0 0 3px;box-shadow:inset -26px 0 40px -26px rgba(60,40,20,.38),0 30px 60px -30px rgba(60,40,20,.5)}
.c-right{border-radius:0 3px 3px 0;box-shadow:inset 26px 0 40px -26px rgba(60,40,20,.34),0 30px 60px -30px rgba(60,40,20,.5)}
.c-head{font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:var(--soft);text-align:center;flex:none;padding-left:.3em}
.c-plate{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-top:14px}
.c-frame{padding:7px;border:1px solid rgba(42,35,27,.45);box-shadow:0 0 0 4px var(--paper),0 0 0 5px rgba(168,130,58,.55);max-height:calc(100% - 70px);display:flex;min-height:0}
.c-frame img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:sepia(.06) contrast(.98)}
.c-cap{font-style:italic;font-size:15px;color:var(--soft);text-align:center;line-height:1.4;max-width:34ch}
.c-cap .pl{font-style:normal;font-family:'Cormorant SC',serif;letter-spacing:.2em;color:var(--rubric);font-size:12px;display:block;margin-bottom:3px}
.c-fleuron{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--rubric)}
.c-fleuron .f{font-size:64px;line-height:1;opacity:.85}
.c-fleuron .w{font-style:italic;color:var(--soft);font-size:15px}
.c-text{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:10px 0}
.c-text .body{font-size:clamp(19px,1.75vw,25px);line-height:1.55;text-align:justify;hyphens:auto;text-wrap:pretty}
.c-text .body.verse{text-align:left;font-size:clamp(19px,1.7vw,24px);line-height:1.5;padding-left:1.2em}
.c-text .body.verse .drop{font-size:3.6em}
.c-src{margin-top:22px;text-align:right;font-family:'Cormorant SC',serif;letter-spacing:.14em;font-size:15px;color:var(--rubric)}
.c-src i{font-family:'EB Garamond',serif;font-style:italic;letter-spacing:0;color:var(--soft);font-size:15px}
.c-foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.c-note{align-self:stretch;font-size:14px;font-style:italic;color:var(--soft);line-height:1.4;padding-top:10px;border-top:1px solid rgba(42,35,27,.2);width:38%;white-space:nowrap;overflow:visible}
.c-note span{display:block;width:250%;white-space:normal}
.c-folio{font-variant-numeric:oldstyle-nums;color:var(--soft);font-size:15px}
.c-leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:0 50%;transform-style:preserve-3d;z-index:5;transition:transform 2.2s cubic-bezier(.45,.05,.25,1)}
.c-leaf.turned{transform:rotateY(-180deg)}
.c-leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.c-leaf .face.back{transform:rotateY(180deg)}
.c-leaf .face:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(60,40,20,.0),rgba(60,40,20,.0));transition:background 2.2s}
.c-leaf.turned .face.front:after{background:linear-gradient(90deg,rgba(60,40,20,.35),rgba(60,40,20,.08))}
.c-nav{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:36px;font-style:italic;font-size:17px;color:#5a4e3f}
.c-nav button:hover{color:var(--rubric)}
.c-nav button:disabled{opacity:.3;cursor:default}
.c-end{position:absolute;inset:0;background:#120e0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;padding:24px 10vw 110px}
.c-end .k{font-family:'Cormorant SC',serif;letter-spacing:.42em;font-size:13px;color:var(--gold);padding-left:.42em;opacity:0;animation:fadeIn 2.6s ease .8s forwards}
.c-end q{quotes:none;font-style:italic;font-size:clamp(26px,3vw,40px);line-height:1.3;color:#eadfc8;max-width:24ch;opacity:0;animation:fadeIn 3s ease 2s forwards}
.c-end .orn{color:var(--rubric);font-size:24px;opacity:0;animation:fadeIn 2s ease 3.6s forwards}
.c-end button{font-style:italic;font-size:17px;color:#9b8e78;opacity:0;animation:fadeIn 2s ease 4.6s forwards}
@media (max-width:820px){
  .c-stage{align-items:stretch;padding:10px 10px 110px}
  .c-book{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:100%;perspective:none}
  .c-leafwrap{position:static}
  .c-pg{position:relative;inset:auto}
  .c-left{border-radius:3px 3px 0 0;box-shadow:none;padding-bottom:10px}
  .c-right{border-radius:0 0 3px 3px;box-shadow:0 30px 60px -30px rgba(60,40,20,.5);padding-top:6px}
  .c-left .c-head{display:none}
  .c-frame{max-height:34vh}.c-frame img{max-height:calc(34vh - 16px)}
  .c-plate{gap:10px}.c-cap{font-size:13px}
  .c-text .body{font-size:19px}
  .c-text{justify-content:flex-start}
  .c-book.turning{animation:mturn 1.6s ease}
  .c-left .c-folio{display:none}
}
@media (max-width:560px){.c-nav{gap:18px;font-size:15px}.b-passage .who{letter-spacing:.18em;font-size:13px}.b-credits{font-size:14px}.b-ctl{gap:24px}}
@keyframes mturn{0%{opacity:1;transform:none}45%{opacity:0;transform:translateX(-14px)}55%{opacity:0;transform:translateX(14px)}100%{opacity:1;transform:none}}
</style>

<body>
<div id="app"></div>
<div id="yt-wrap"><div id="yt"></div></div>
<nav id="proto" aria-label="Prototype variant switcher">
  <span class="tag">PROTOTYPE</span>
  <button id="pv" aria-label="Previous variant">&larr;</button>
  <span class="lbl" id="plbl"></span>
  <button id="nv" aria-label="Next variant">&rarr;</button>
  <span class="st" id="pst"></span>

<script>
/* ===================== DATA: shaped like a real pack file ===================== */

        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/La_Anunciaci%C3%B3n_%28Fra_Angelico-Prado%29.jpg/1920px-La_Anunciaci%C3%B3n_%28Fra_Angelico-Prado%29.jpg", title: "The Annunciation, c. 1426", credit: "Fra Angelico" },

      },
      {
        sound: { title: "Rorate caeli", credit: "Harpa Dei", youtube: "https://www.youtube.com/watch?v=6VdF6xsMxhk" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Geertgen_tot_Sint_Jans%2C_The_Nativity_at_Night%2C_c_1490.jpg/1920px-Geertgen_tot_Sint_Jans%2C_The_Nativity_at_Night%2C_c_1490.jpg", title: "The Nativity at Night, c. 1490", credit: "Geertgen tot Sint Jans" },
        passage: { text: "Arise, shine;\nfor thy light is come,\nand the glory of the Lord\nis risen upon thee.", credit: "Isaiah 60:1", source: "King James Version" }
      }
    ]
  },
  {
    id: "saints",
    name: "Saints",
    curator: "Splendor",
    description: "Men and women who were set on fire, in their own words.",
    moments: [
      {
        sound: { title: "Miserere mei, Deus", credit: "Allegri, sung by Tenebrae, conducted by Nigel Short", youtube: "https://www.youtube.com/watch?v=H3v9unphfi0" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/The_Calling_of_Saint_Matthew-Caravaggo_%281599-1600%29.jpg/1920px-The_Calling_of_Saint_Matthew-Caravaggo_%281599-1600%29.jpg", title: "The Calling of Saint Matthew, 1600", credit: "Caravaggio" },
        passage: { text: "Late have I loved you,\nbeauty so ancient and so new,\nlate have I loved you.", credit: "Saint Augustine", source: "Confessions, Book X" }
      },
      {
        sound: { title: "Air, from Orchestral Suite No. 3", credit: "J. S. Bach, Concentus Musicus Wien, Nikolaus Harnoncourt", youtube: "https://www.youtube.com/watch?v=su0MMGllWy0" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.jpg/1920px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.jpg", title: "The Milkmaid, c. 1658", credit: "Johannes Vermeer" },
        passage: { text: "Let nothing disturb thee,\nNothing affright thee;\nAll things are passing;\nGod never changeth;\nPatient endurance\nAttaineth to all things;\nWho God possesseth\nIn nothing is wanting;\nAlone God sufficeth.", credit: "Saint Teresa of Ávila", source: "Her bookmark, translated by Henry Wadsworth Longfellow", form: "verse" }
      },
      {

        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Caspar_David_Friedrich_-_Mondaufgang_%C3%BCber_dem_Meer.jpg/1920px-Caspar_David_Friedrich_-_Mondaufgang_%C3%BCber_dem_Meer.jpg", title: "Moonrise over the Sea, 1822", credit: "Caspar David Friedrich" },
        passage: { text: "O Jesus, my Love,\nat last I have found my vocation:\nmy vocation is love!", credit: "Saint Thérèse of Lisieux", source: "Story of a Soul" }
      },

        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Rembrandt_Harmensz._van_Rijn_-_The_Return_of_the_Prodigal_Son.jpg/1920px-Rembrandt_Harmensz._van_Rijn_-_The_Return_of_the_Prodigal_Son.jpg", title: "The Return of the Prodigal Son, c. 1669", credit: "Rembrandt van Rijn" },
        passage: { text: "Nothing is so strong as gentleness;\nnothing so gentle\nas real strength.", credit: "Saint Francis de Sales", source: "Attributed" }
      }
    ]
  },
  {
    id: "builders",
    name: "Builders",
    curator: "Lincoln",
    description: "For people who make things. Patience, discipline and the long view.",
    moments: [
      {
        sound: { title: "Gymnopédie No. 1", credit: "Erik Satie", youtube: "https://www.youtube.com/watch?v=eMnxjdGTK4w" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/3/33/Joseph_Mallord_William_Turner_-_Norham_Castle%2C_Sunrise_-_WGA23182.jpg", title: "Norham Castle, Sunrise, c. 1845", credit: "J. M. W. Turner" },
        passage: { text: "In the morning when thou risest unwillingly,\nlet this thought be present:\nI am rising to the work\nof a human being.", credit: "Marcus Aurelius", source: "Meditations V.1, translated by George Long" }
      },
      {
        sound: { title: "On the Nature of Daylight", credit: "Max Richter", youtube: "https://www.youtube.com/watch?v=iGZ-uiaEUlI" },
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Albert_Bierstadt_-_Among_the_Sierra_Nevada%2C_California_-_Google_Art_Project.jpg/1920px-Albert_Bierstadt_-_Among_the_Sierra_Nevada%2C_California_-_Google_Art_Project.jpg", title: "Among the Sierra Nevada, California, 1868", credit: "Albert Bierstadt" },
        passage: { text: "You do not rise\nto the level of your goals.\nYou fall\nto the level of your systems.", credit: "James Clear", source: "Atomic Habits" }
      },
      {
        sound: { title: "Spiegel im Spiegel", credit: "Arvo Pärt, performed by Annabel Guaita", youtube: "https://www.youtube.com/watch?v=Th4QJd2m1CI" },
        passage: { text: "Volume negates luck.", credit: "Alex Hormozi", source: "$100M Leads" }
      },
      {
        image: { url: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/The_Great_Wave_off_Kanagawa.jpg/1920px-The_Great_Wave_off_Kanagawa.jpg", title: "The Great Wave off Kanagawa, c. 1831", credit: "Katsushika Hokusai" },
        passage: { text: "Be like the promontory\nagainst which the waves continually break,\nbut it stands firm\nand tames the fury of the water around it.", credit: "Marcus Aurelius", source: "Meditations IV.49, translated by George Long" }
      }
    ]
  }
];

/* ===================== ENGINE (shared by all variants) ===================== */
const Q = new URLSearchParams(location.search);
const FAST = Q.get('fast') === '1';
const VARIANTS = [{ key: 'A', name: 'Gallery' }, { key: 'B', name: 'Chapel' }, { key: 'C', name: 'Book' }];
const EST_SOUND = FAST ? 15 : 210, EST_SILENT = FAST ? 15 : 60, FADE = FAST ? 6 : 30;
const app = document.getElementById('app');
const now = () => performance.now() / 1000;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ytId = u => (u.match(/[?&]v=([\w-]{11})/) || u.match(/youtu\.be\/([\w-]{11})/) || [])[1];
const flat = t => t.replace(/\n/g, ' ');
const minutesLabel = m => m ? m + ' minutes' : 'the whole Pack';

let S = {
  variant: (Q.get('variant') || 'A').toUpperCase(), screen: 'home', packId: null, minutes: 0,
  plan: [], pos: 0, momentStart: 0, momentLen: 0, deadline: Infinity, paused: false, pausedAt: 0,
  ending: false, endAt: 0, endLine: '', sound: '—'
};
if (!VARIANTS.find(v => v.key === S.variant)) S.variant = 'A';

const pack = () => PACKS.find(p => p.id === S.packId);
const cur = () => pack().moments[S.plan[S.pos]];
const cover = p => (p.moments.find(m => m.image) || {}).image;

const imgCache = {};
function imageOk(img) {
  if (!img) return Promise.resolve(false);
  return imgCache[img.url] ||= new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = img.url; });
}

function carryLine() {
  const played = S.plan.slice(0, S.pos + 1).map(i => pack().moments[i]).filter(m => m.passage).reverse();
  const p = (played[0] || pack().moments.find(m => m.passage)).passage;
  const parts = flat(p.text).split(/(?<=[.;:!?])\s+/);
  let line = parts.find(s => s.length >= 18 && s.length <= 80) || parts[0];
  line = line.replace(/[,;:]$/, '.');
  return { text: line.charAt(0).toUpperCase() + line.slice(1), credit: p.credit };
}

/* ---- audio: YouTube + WebAudio chime ---- */
let YTP = null, ytReady = false, pendingId = null, volTimer = null, AC = null;
window.onYouTubeIframeAPIReady = () => {
  YTP = new YT.Player('yt', {
    width: 200, height: 200,
    playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ytReady = true; if (pendingId) { const id = pendingId; pendingId = null; playSound(id); } },
      onStateChange: e => {
        if (e.data === 1) S.sound = 'playing';
        if (e.data === 3) S.sound = 'buffering';
        if (e.data === 0 && S.screen === 'moment' && !FAST) { if (S.pos < S.plan.length - 1 && !S.ending) next(); }
      },
      onError: e => { S.sound = 'unavailable (' + e.data + ')'; S.momentLen = (now() - S.momentStart) + EST_SILENT; }
    }
  });
};
function fadeVolume(to, ms, done) {
  clearInterval(volTimer);
  if (!ytReady) { done && done(); return; }
  const from = YTP.getVolume ? YTP.getVolume() : 100, t0 = performance.now();
  volTimer = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    try { YTP.setVolume(Math.round(from + (to - from) * k)); } catch (_) {}
    if (k >= 1) { clearInterval(volTimer); done && done(); }
  }, 60);
}
function playSound(id) {
  if (!ytReady) { pendingId = id; S.sound = 'loading'; return; }
  S.sound = 'loading';
  YTP.setVolume(0); YTP.loadVideoById(id); fadeVolume(100, 2500);
}
function stopSound(ms = 1200, then) { pendingId = null; if (!ytReady) { then && then(); return; } fadeVolume(0, ms, () => { try { YTP.pauseVideo(); } catch (_) {} then && then(); }); }
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    AC.resume();
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch (_) {}
}
function chime() {
  if (!AC) return;
  const t = AC.currentTime + 0.05, out = AC.createGain(); out.gain.value = 0.22;
  const delay = AC.createDelay(), fb = AC.createGain(), lp = AC.createBiquadFilter();
  delay.delayTime.value = 0.31; fb.gain.value = 0.28; lp.type = 'lowpass'; lp.frequency.value = 2200;
  out.connect(AC.destination); out.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(AC.destination);
  const strike = (f0, at, amp) => [[1, 1, 7], [2.0, .32, 4.5], [2.76, .22, 3.2], [5.4, .08, 1.8], [8.93, .04, 1.1]].forEach(([r, a, d]) => {
    [1, 1.0027].forEach(det => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f0 * r * det;
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(a * amp * .5, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
      o.connect(g); g.connect(out); o.start(at); o.stop(at + d + .1);
    });
  });
  strike(329.63, t, 1); strike(493.88, t + 2.2, .45);
}

/* ---- flow ---- */
function goHome() { stopSound(1500); S = { ...S, screen: 'home', packId: null, ending: false, paused: false }; render(); }
function openPack(id) { S.packId = id; S.screen = 'threshold'; render(); }
function begin(minutes) {
  unlockAudio();
  const ms = pack().moments;
  const total = minutes ? minutes * 60 * (FAST ? EST_SOUND / 210 : 1) : Infinity;
  let t = 0; const plan = [];
  for (let i = 0; i < ms.length && t < total; i++) { plan.push(i); t += FAST ? 15 : (ms[i].sound ? EST_SOUND : EST_SILENT); }
  Object.assign(S, { minutes, plan, pos: 0, screen: 'moment', ending: false, paused: false, deadline: minutes ? now() + total : Infinity });
  document.body.classList.remove('paused');
  startMoment(true);
}
function startMoment(first) {
  const m = cur();
  S.momentStart = now(); S.momentLen = m.sound ? EST_SOUND : EST_SILENT;
  if (m.sound) { if (first) playSound(ytId(m.sound.youtube)); else stopSound(1400, () => playSound(ytId(m.sound.youtube))); S.sound = 'loading'; }
  else { stopSound(1800); S.sound = 'none (no Sound)'; }
  const nx = pack().moments[S.plan[S.pos + 1]]; if (nx) imageOk(nx.image);
  if (first) render(); else V().moment(m, info(), false);
  updateSwitcher();
}
function info() { return { pos: S.pos, total: S.plan.length, pack: pack(), paused: S.paused, minutes: S.minutes }; }
function next() {
  if (S.screen !== 'moment' || S.ending) return;
  if (S.pos < S.plan.length - 1) { S.pos++; startMoment(false); }
  else startEnding(Math.min(FADE, 8));
}
function prev() { if (S.screen !== 'moment' || S.ending || S.pos === 0) return; S.pos--; startMoment(false); }
function togglePause() {
  if (S.screen !== 'moment' || S.ending) return;
  S.paused = !S.paused;
  if (S.paused) { S.pausedAt = now(); try { YTP && YTP.pauseVideo(); } catch (_) {} }
  else { const dt = now() - S.pausedAt; S.momentStart += dt; S.deadline += dt; try { cur().sound && YTP && YTP.playVideo(); } catch (_) {} }
  document.body.classList.toggle('paused', S.paused);
  V().paused && V().paused(S.paused);
  updateSwitcher();
}
function startEnding(sec) {
  if (S.ending) return;
  S.ending = true; S.endAt = now() + sec;
  V().ending(sec);
  if (ytReady) fadeVolume(0, sec * 1000);
  setTimeout(() => {
    try { YTP && YTP.pauseVideo(); } catch (_) {}
    chime(); S.sound = 'ended';
    S.endLine = carryLine(); S.screen = 'end'; S.ending = false;
    setTimeout(render, 600);
  }, sec * 1000);
  updateSwitcher();
}
function momentRemaining() {
  const m = cur();
  if (!FAST && m.sound && S.sound === 'playing' && YTP && YTP.getDuration && YTP.getDuration() > 0) return YTP.getDuration() - YTP.getCurrentTime();
  return S.momentLen - (now() - S.momentStart);
}
setInterval(() => {
  if (S.screen !== 'moment' || S.paused) return;
  const mr = momentRemaining();
  const last = S.pos === S.plan.length - 1;
  const left = Math.min(S.deadline - now(), last ? mr : Infinity);
  if (!S.ending && left <= FADE) startEnding(Math.max(1, left));
  else if (!S.ending && mr <= 0 && !last) next();
  const len = (!FAST && cur().sound && S.sound === 'playing' && YTP.getDuration()) || S.momentLen;
  V().progress && V().progress(Math.max(0, Math.min(1, 1 - mr / len)));
  updateSwitcher();
}, 250);

/* ---- variant plumbing ---- */
let mounted = null;
const V = () => IMPL[S.variant];
function render() {
  if (mounted !== S.variant) { app.className = 'v' + S.variant; mounted = S.variant; }
  app.innerHTML = '';
  const v = V();
  if (S.screen === 'home') v.home();
  else if (S.screen === 'threshold') v.threshold(pack());
  else if (S.screen === 'moment') { v.moment(cur(), info(), true); if (S.ending) v.ending(Math.max(1, S.endAt - now())); }
  else if (S.screen === 'end') v.end(S.endLine, pack());
  updateSwitcher();
}
function updateSwitcher() {
  const v = VARIANTS.find(v => v.key === S.variant);
  document.getElementById('plbl').textContent = v.key + ' · ' + v.name;
  let st = S.screen;
  if (S.screen === 'threshold') st = 'choosing · ' + pack().name;
  if (S.screen === 'moment') {
    const r = S.deadline === Infinity ? '' : ' · ' + fmt(S.deadline - (S.paused ? S.pausedAt : now())) + ' left';
    st = pack().name + ' · Moment ' + (S.pos + 1) + '/' + S.plan.length + ' · ' + (S.minutes ? S.minutes + ' min' : 'play') + r + ' · Sound ' + S.sound + (S.paused ? ' · paused' : '') + (S.ending ? ' · ending' : '');
  }
  if (S.screen === 'end') st = 'Session ended' ;
  document.getElementById('pst').textContent = st + (FAST ? ' · fast' : '');
}
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function switchVariant(d) {
  const i = VARIANTS.findIndex(v => v.key === S.variant);
  S.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key;
  Q.set('variant', S.variant); history.replaceState(null, '', '?' + Q.toString());
  document.body.classList.remove('idle');
  render();
}
document.getElementById('pv').onclick = () => switchVariant(-1);
document.getElementById('nv').onclick = () => switchVariant(1);
document.addEventListener('keydown', e => {
  const t = e.target; if (t.closest && t.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') switchVariant(-1);
  if (e.key === 'ArrowRight') switchVariant(1);
  if (e.key === ' ' && S.screen === 'moment') { e.preventDefault(); togglePause(); }
});
let idleT = null;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2800); V().wake && V().wake(); };
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const veil = root => { let d = root.querySelector('.dark-veil'); if (!d) { d = el('<div class="dark-veil"></div>'); root.appendChild(d); } return d; };
function runVeil(root, sec) { const d = veil(root); d.style.transitionDuration = sec + 's'; requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('on'))); }

/* ===================== A · GALLERY ===================== */
const A = {
  home() {

/* ===================== B · CHAPEL ===================== */
const candle = '<div class="candle"><div class="halo"></div><div class="wax"></div><div class="wick"></div><div class="flame"></div></div>';
const B = {
  home() {

  },

    const o = s.querySelector('.b-opts'), enter = s.querySelector('.b-enter');

      const b = el('<button></button>'); b.textContent = l;
      b.onclick = () => { pick = m; o.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); enter.classList.add('ready'); };
      o.appendChild(b);
    });

    enter.onclick = () => {

  moment(m, inf, fresh) {
    let s = app.querySelector('.b-stage');
    if (fresh || !s) {
      app.innerHTML = '';
      s = el('<div class="screen b-stage"><div class="b-layers"></div><div class="b-vignette"></div><div class="b-credits"></div><div class="b-ctl"><button data-a="pause">Pause</button><button data-a="next">Next</button><button data-a="leave">Leave</button></div></div>');
      s.querySelector('[data-a=pause]').onclick = e => { e.stopPropagation(); togglePause(); };
      s.querySelector('[data-a=next]').onclick = e => { e.stopPropagation(); next(); };

      [...layers.children].filter(x => x !== layer).forEach(x => { x.classList.remove('show'); setTimeout(() => x.remove(), 3100); });
      const bits = [];
      if (m.image) bits.push(ok ? esc(m.image.credit) + ', ' + esc(m.image.title) : 'Image could not load');

        s.insertBefore(pg, s.querySelector('.b-credits'));

        const spans = [...pg.querySelectorAll('.ln')];
        const tick = (i) => {
          if (!pg.isConnected) return;

};

/* ===================== C · BOOK ===================== */
const roman = n => ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][n - 1] || n;
const dropcap = (text, boxed) => { const t = esc(text); const i = t.search(/[A-Za-z]/); return t.slice(0, i) + '<span class="drop' + (boxed ? ' boxed' : '') + '">' + t[i] + '</span>' + t.slice(i + 1); };
const C = {
  home() {
    const s = el('<div class="screen c-scroll fade-in"><article class="c-page c-paper"><div class="c-small">A Book of Moments</div><h1 class="c-title">Splendo<span class="r">r</span></h1><div class="c-sub">the true, the good and the beautiful</div><span class="c-orn">❦</span><section class="c-toc"><h3>Contents</h3><div class="list"></div></section></article></div>');
    let page = 3;
    PACKS.forEach((p, i) => {
      const b = el('<button class="c-entry"><div class="c-row"><span class="num"></span><span class="t"></span><span class="lead"></span><span class="pg"></span></div><div class="desc"></div></button>');
      b.querySelector('.num').textContent = roman(i + 1) + '.';
      b.querySelector('.t').textContent = p.name;
      b.querySelector('.pg').textContent = page; page += p.moments.length * 2 + 2;
      b.querySelector('.desc').textContent = p.description + ' Gathered by ' + p.curator + '.';
      b.onclick = () => openPack(p.id);
      s.querySelector('.list').appendChild(b);
    });
    app.appendChild(s);
  },
  threshold(p) {
    const i = PACKS.indexOf(p) + 1;
    const s = el('<div class="screen c-scroll fade-in"><article class="c-page c-paper c-chapter"><button class="c-back">Contents</button><div class="c-small" style="color:var(--rubric)"></div><h1 class="c-title" style="font-size:clamp(48px,7vw,76px)"></h1><div class="c-sub"></div><p class="body"></p><span class="c-orn">⁂</span><div class="c-how"><div class="q">Read for</div><div class="opts"></div></div></article></div>');

    s.querySelector('.c-sub').textContent = 'gathered by ' + p.curator;

    const o = s.querySelector('.opts');
    [[5, 'five minutes'], [10, 'ten'], [15, 'fifteen'], [0, 'straight through']].forEach(([m, l]) => {
      const b = el('<button></button>'); b.textContent = l; b.onclick = () => begin(m); o.appendChild(b);

    else left += '<div class="c-fleuron"><div class="f">❦</div><div class="w">' + (m.image ? 'The plate could not be printed.' : 'Here there is no picture, only the word.') + '</div></div>';
    left += '<div class="c-foot"><div class="c-folio">' + (folio - 1) + '</div></div>';
    let right = '<div class="c-head">' + (m.passage ? esc(m.passage.credit) : esc(inf.pack.name)) + '</div><div class="c-text">';
    if (m.passage) {
      const verse = m.passage.form === 'verse';
      right += '<div class="body' + (verse ? ' verse' : '') + '">' + (verse ? dropcap(m.passage.text).replace(/\n/g, '<br>') : dropcap(flat(m.passage.text))) + '</div>';

    }
    right += '</div><div class="c-foot"><div class="c-note"><span>' + (m.sound ? 'Sounding: <b style="font-weight:500;font-style:normal">' + esc(m.sound.title) + '</b>, ' + esc(m.sound.credit) + '.' : 'This page is read in silence.') + '</span></div><div class="c-folio">' + folio + '</div></div>';
    return { left, right };
  },
  moment(m, inf, fresh) {
    imageOk(m.image).then(ok => {
      const pg = C.pages(m, inf, ok);
      let s = app.querySelector('.c-stage');

        app.innerHTML = '';
        s = el('<div class="screen c-stage fade-in"><div class="c-book"><div class="c-leafwrap"><div class="c-pg c-left c-paper"></div></div><div class="c-leafwrap"><div class="c-pg c-right c-paper"></div></div></div><nav class="c-nav"><button data-a="prev">&lsaquo; turn back</button><button data-a="pause">pause</button><button data-a="next">turn the page &rsaquo;</button><button data-a="leave">close the book</button></nav></div>');
        s.querySelector('[data-a=prev]').onclick = prev;
        s.querySelector('[data-a=next]').onclick = next;
        s.querySelector('[data-a=pause]').onclick = togglePause;
        s.querySelector('[data-a=leave]').onclick = goHome;
        s.querySelector('.c-left').innerHTML = pg.left; s.querySelector('.c-right').innerHTML = pg.right;
        app.appendChild(s);
      } else {
        const book = s.querySelector('.c-book'), L = s.querySelector('.c-left'), R = s.querySelector('.c-right');
        if (matchMedia('(max-width:820px)').matches) {
          book.classList.remove('turning'); void book.offsetWidth; book.classList.add('turning');
          setTimeout(() => { L.innerHTML = pg.left; R.innerHTML = pg.right; }, 750);
        } else {
          book.querySelectorAll('.c-leaf').forEach(x => x.remove());
          const leaf = el('<div class="c-leaf"><div class="face front c-pg c-right c-paper"></div><div class="face back c-pg c-left c-paper"></div></div>');
          leaf.querySelector('.front').innerHTML = R.innerHTML;
          leaf.querySelector('.back').innerHTML = pg.left;
          book.appendChild(leaf);
          R.innerHTML = pg.right;
          requestAnimationFrame(() => requestAnimationFrame(() => leaf.classList.add('turned')));
          setTimeout(() => { L.innerHTML = pg.left; leaf.remove(); }, 2300);
        }
      }
      s.querySelector('[data-a=prev]').disabled = inf.pos === 0;
      s.querySelector('[data-a=pause]').textContent = S.paused ? 'resume' : 'pause';
    });
  },
  paused(p) { const b = app.querySelector('.c-nav [data-a=pause]'); if (b) b.textContent = p ? 'resume' : 'pause'; },
  ending(sec) { runVeil(app.querySelector('.c-stage') || app, sec); },
  end(line) {
    const s = el('<div class="screen c-end"><div class="k">Here ends the reading</div><q></q><div class="orn">❦</div><button>Return to the Contents</button></div>');
    s.querySelector('q').textContent = line.text;
    s.querySelector('button').onclick = goHome;
    app.appendChild(s);
  }
};

const IMPL = { A, B, C };
render();
(() => { const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); })();
